<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Pragmathic logo">
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vertical code bar (the stem of the P) -->
    <path d="M 28 10 L 28 90" stroke-width="6"/>
    <!-- Semicircle completing the P bowl -->
    <path d="M 31 16 A 23 21 0 0 1 31 58" stroke-width="6"/>
