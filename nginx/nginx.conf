user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    # Limit request/response buffer sizes to protect server memory
    client_body_buffer_size    16k;
    client_max_body_size       10M;
    client_header_buffer_size  1k;
    large_client_header_buffers 4 8k;
    proxy_buffer_size          16k;
    proxy_buffers              8 16k;
    proxy_busy_buffers_size    32k;
    # Timeouts
    client_body_timeout   30s;
    client_header_timeout 15s;
    send_timeout          60s;
    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/wasm;

    # Rate limiting zones — generous enough for SPA (multiple API calls per page load)
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/s;

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name deiza.org www.deiza.org;

        # Allow Let's Encrypt ACME challenge (needed before certs exist)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://deiza.org$request_uri;
        }
    }

    # Redirect www → non-www (HTTPS)
    server {
        listen 443 ssl;
        http2 on;
        server_name www.deiza.org;

        ssl_certificate     /etc/letsencrypt/live/deiza.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/deiza.org/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        return 301 https://deiza.org$request_uri;
    }

    # HTTP fallback server — active when SSL certs are NOT yet available
    # Remove this block once certbot has issued the certificate
    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://deiza-backend:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
        }

        location ~ ^/api/chat/(demo/)?stream {
            proxy_pass http://deiza-backend:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            chunked_transfer_encoding on;
            proxy_set_header X-Accel-Buffering no;
        }

        location /auth/ {
            proxy_pass http://deiza-backend:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
        }
    }

    # Main HTTPS server
    server {
        listen 443 ssl;
        http2 on;
        server_name deiza.org;

        # SSL — generated automatically by certbot
        # If certs don't exist yet, comment out this block and use port 8080 above
        ssl_certificate     /etc/letsencrypt/live/deiza.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/deiza.org/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Max upload size (match Flask's 10MB)
        client_max_body_size 10M;

        # --- Frontend (React SPA) ---
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
            # index.html must never be cached — ensures new deploys load immediately
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
        }

        # Service worker — must not be cached
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri =404;
        }

        # PWA manifest
        location = /manifest.webmanifest {
            add_header Cache-Control "no-cache";
            types { application/manifest+json webmanifest; }
            try_files $uri =404;
        }

        # Cache static assets aggressively (excludes sw.js and manifest above)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # --- Stripe Webhook (raw body must NOT be modified) ---
        location = /api/stripe/webhook {
            proxy_pass http://deiza-backend:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Stripe-Signature $http_stripe_signature;
            # Disable gzip so the raw payload reaches Flask unmodified
            proxy_set_header Accept-Encoding "";
            # Pass through the original Content-Type (required for signature verification)
            proxy_pass_request_headers on;
            # No buffering — body must arrive byte-identical
            proxy_request_buffering off;
            # No rate limiting — Stripe retries on failure and must succeed
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
        }

        # --- Backend API (non-streaming) ---
        location /api/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://deiza-backend:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
        }

        # --- Streaming SSE endpoints (chat stream) ---
        # Must disable buffering so chunks reach the client immediately
        location ~ ^/api/chat/(demo/)?stream {
            limit_req zone=api burst=5 nodelay;
            proxy_pass http://deiza-backend:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            chunked_transfer_encoding on;
            # Tell upstream not to buffer either
            proxy_set_header X-Accel-Buffering no;
        }

        # --- Auth endpoints ---
        location /auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://deiza-backend:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
        }
    }
}
