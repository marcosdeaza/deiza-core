services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deiza-backend
    restart: unless-stopped
    # Let in-flight answers finish on redeploys (gunicorn --graceful-timeout 120); Docker default was 10 s.
    stop_grace_period: 45s
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - FLASK_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    deploy:
      resources:
        limits:
          memory: 7G
        reservations:
          memory: 512M
    volumes:
      - deiza-db:/app/instance
    ports:
      - "127.0.0.1:5000:5000"
    expose:
      - "5000"
    networks:
      - deiza-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: deiza-redis
    restart: unless-stopped
    expose:
      - "6379"
    networks:
      - deiza-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile.prod
    container_name: deiza-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - deiza-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  searxng:
    image: searxng/searxng:latest
    container_name: deiza-searxng
    restart: unless-stopped
    environment:
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY:-change-me}
    volumes:
      - ./searxng:/etc/searxng:rw
    expose:
      - "8080"
    networks:
      - deiza-net
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

volumes:
  deiza-db:
  certbot-www:

networks:
  deiza-net:
    driver: bridge

